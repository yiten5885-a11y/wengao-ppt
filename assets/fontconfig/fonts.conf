<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  项目内 fontconfig 配置（平台中立的**模板**）。

  为什么需要它：本机（macOS，LibreOffice 26.8）既没有 /etc/fonts/fonts.conf，
  也没有 ~/.config/fontconfig/fonts.conf，LibreOffice 因此看不到任何系统字体，
  真实渲染时**所有中文字形被静默丢弃**（页面上只剩数字与拉丁字母，或整片方框），
  而渲染器退出码仍是 0。

  平台相关的字体目录**不在本文件写死**：下面的标记在执行时由
  `wengao_ppt.fontenv.effective_conf_text()` 替换为当前 OS 的标准目录
  （macOS / Windows / Linux 各自适配），个人目录用运行时 HOME 展开。
  有效配置与缓存写到数据根 `<data_root>/.fontconfig/`，不写程序版本目录。

  本文件只通过 FONTCONFIG_FILE 环境变量在调用 LibreOffice 时生效，
  不写入 /etc 或用户目录，也不修改系统 PATH；不复制、不下载任何字体文件。
-->
<fontconfig>
<!--WENGAO_PLATFORM_FONT_DIRS-->
  <cachedir prefix="xdg">fontconfig</cachedir>

  <!-- 上游默认字体在部分平台不存在：显式映射到本机实测可用的中文字体，
       避免"声明了字体名但实际无字"。映射是计划动作，写入证据。
       2026-10-21 00:25：目标字体由 Hiragino Sans GB 改为 **Arial Unicode MS**——
       与产品写出的 a:ea 槽保持一致（S6 原生对照 13 页无缺字；日文 Hiragino
       对部分简体字缺字形）。只影响本包 FONTCONFIG_FILE 生效的渲染子进程，
       不写入 /etc 或用户目录，不复制/分发字体文件。 -->
  <match target="pattern">
    <test name="family"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Arial Unicode MS</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>微软雅黑</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Arial Unicode MS</string></edit>
  </match>
  <!-- 2026-11-04：映射加固。主题族「黑体/SimHei」此前没有任何映射，LibreOffice
       只能回退到覆盖不全的字体；显式映射到**包内自带** Noto Sans SC（OFL、
       随包分发、简体全覆盖），不依赖目标机器是否装了某款商业字体。
       注：曾疑为 job-293501ae3698 页 3 CHAR_MISSING/CHAR_UNMATCHED 的成因，
       后经 PDF 文本层核验排除——该任务真因是精修把标签声明框砍小（见
       wengao_ppt/refine.py fit_page_type_scale 的只增不缩修复），本映射
       与该任务失败无关，仅作为缺字风险的一般性加固保留。 -->
  <match target="pattern">
    <test name="family"><string>黑体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>SimHei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Songti</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Songti SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>SimSun</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Songti SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Heiti</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Heiti SC</string></edit>
  </match>

  <!-- 泛型族显式指向含中文字形的字体 -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Arial Unicode MS</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Songti SC</string></edit>
  </match>
</fontconfig>
